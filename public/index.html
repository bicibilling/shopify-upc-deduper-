<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPC Duplicate Cleaner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="header-text">
        <h1>UPC Duplicate Cleaner</h1>
        <p>Find and remove Shopify variants with duplicate barcodes</p>
      </div>
      <button id="scan-btn" class="btn btn-primary">Scan for Duplicates</button>
    </div>
  </header>

  <main class="main">
    <div id="empty-state" class="empty-state">
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 013.75 9.375v-4.5zM3.75 14.625c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5a1.125 1.125 0 01-1.125-1.125v-4.5zM13.5 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 0113.5 9.375v-4.5z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 6.75h.75v.75h-.75v-.75zM6.75 16.5h.75v.75h-.75V16.5zM16.5 6.75h.75v.75h-.75v-.75z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 16.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v.75c0 .621-.504 1.125-1.125 1.125h-4.5a1.125 1.125 0 01-1.125-1.125v-.75z" />
      </svg>
      <p>Click <strong>Scan for Duplicates</strong> to get started</p>
    </div>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Scanning your product catalog&hellip;</p>
    </div>

    <div id="results" class="hidden">
      <div id="summary" class="summary"></div>
      <div id="groups"></div>
    </div>

    <div id="no-dupes" class="empty-state hidden">
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <p>No duplicate barcodes found — your catalog is clean!</p>
    </div>
  </main>

  <div id="toast" class="toast hidden"></div>

  <div id="confirm-modal" class="modal-overlay hidden">
    <div class="modal">
      <h2>Delete Variant?</h2>
      <p id="confirm-text"></p>
      <div class="modal-actions">
        <button id="confirm-cancel" class="btn btn-secondary">Cancel</button>
        <button id="confirm-delete" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
